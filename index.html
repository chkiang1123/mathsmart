<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathSmart — Functions &amp; Graphs | S.K.H. Bishop Baker Secondary School</title>
    <meta name="description" content="Interactive mathematics study platform with LaTeX step-by-step analysis and visualizations. S.K.H. Bishop Baker Secondary School — All rights reserved." />
    <meta property="og:title" content="MathSmart — Functions &amp; Graphs | S.K.H. Bishop Baker Secondary School" />
    <meta property="og:description" content="Interactive mathematics study platform with LaTeX step-by-step analysis and visualizations. S.K.H. Bishop Baker Secondary School — All rights reserved." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-sky-900 dark:selection:bg-sky-900 dark:selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__MATHSMART_BOOTED__) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          fetch('./docs/index.html', { method: 'HEAD' })
            .then(function (res) {
              if (res.ok) {
                window.location.replace('./docs/');
              } else {
                throw new Error('docs bundle missing');
              }
            })
            .catch(function () {
              root.innerHTML =
                '<div style="max-width:560px;margin:48px auto;padding:24px;border:1px solid #334155;border-radius:12px;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;line-height:1.5">' +
                '<h2 style="margin:0 0 8px;font-size:18px">MathSmart GitHub Pages Setup</h2>' +
                '<p style="margin:0 0 12px;font-size:14px;color:#94a3b8">This repository serves the compiled app from <code>/docs</code> or via GitHub Actions.</p>' +
                '<a href="./docs/" style="display:inline-block;padding:8px 14px;border-radius:8px;background:#0284c7;color:#fff;text-decoration:none;font-size:14px;font-weight:600">Open Compiled App (./docs/)</a>' +
                '</div>';
            });
        }, 500);
      });
    </script>
  </body>
</html>
